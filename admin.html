<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>لوحة الاتحاد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script></head><body>
<header><h1>لوحة الاتحاد</h1><p>رابطة الشريف والنور</p></header>
<main>
<div id="login" class="card"><input id="em" type="email" placeholder="البريد" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr"><button class="b" id="go">دخول</button><p id="err"></p></div>
<div id="app" style="display:none">
<nav><button class="on" data-t="a1">المباريات</button><button data-t="a2">الهدافون</button><button data-t="a3">السجل</button></nav>
<section id="a1" class="on">
 <div class="card"><b>إضافة مباراة</b><br>
 <input id="wk" type="number" placeholder="الأسبوع" style="width:90px">
 <select id="hm"></select> ضد <select id="aw"></select><br>
 <input id="dt" type="date"><input id="tm" type="time"><button class="b" id="addm">إضافة</button></div>
 <div id="ml"></div></section>
<section id="a2"><div class="card"><input id="pn" placeholder="اسم اللاعب"><select id="pt"></select><input id="pg" type="number" placeholder="الأهداف" style="width:90px"><button class="b" id="adds">إضافة</button></div><div id="sl"></div></section>
<section id="a3"><div id="lg"></div></section>
<button class="b d" id="out">خروج</button>
</div></main>
<script src="config.js"></script><script src="common.js"></script>
<script>
let me="", D, names={};
const log = (w)=>sb.from("changelog").insert({who:me,what:w});
$("#go").onclick = async()=>{
  const {data,error} = await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){$("#err").textContent="بيانات الدخول غير صحيحة";return}
  start(data.user.email);
};
$("#out").onclick = async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{ if(data.session) start(data.session.user.email) });
async function start(email){
  me=email; $("#login").style.display="none"; $("#app").style.display="block"; tabs(); await refresh();
}
async function refresh(){
  D = await loadAll(); names={}; D.teams.forEach(t=>names[t.id]=t.name);
  const opts = D.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  ["#hm","#aw","#pt"].forEach(s=>{const v=$(s).value; $(s).innerHTML=opts; if(v)$(s).value=v});
  $("#ml").innerHTML = D.matches.map(x=>`<div class="card">${matchHTML(x,names)}
   <input type="number" id="h${x.id}" value="${x.home_goals??""}" style="width:60px"> - <input type="number" id="a${x.id}" value="${x.away_goals??""}" style="width:60px">
   <button class="b" onclick="fin(${x.id})">حفظ النتيجة</button>
   <button class="b" onclick="post(${x.id})">تأجيل</button>
   <button class="b" onclick="sch(${x.id})">إعادة جدولة</button>
   <button class="b d" onclick="delm(${x.id})">حذف</button></div>`).join("");
  $("#sl").innerHTML = D.scorers.map(s=>`<div class="card">${esc(s.player)} (${esc(names[s.team_id])}) —
   <input type="number" id="g${s.id}" value="${s.goals}" style="width:60px">
   <button class="b" onclick="sg(${s.id})">تعديل</button><button class="b d" onclick="dels(${s.id})">حذف</button></div>`).join("");
  const {data} = await sb.from("changelog").select("*").order("at",{ascending:false}).limit(50);
  $("#lg").innerHTML = (data||[]).map(r=>`<div class="card">${esc(r.what)}<br><small>${esc(r.who)} — ${new Date(r.at).toLocaleString("ar")}</small></div>`).join("");
}
$("#addm").onclick = async()=>{
  const h=+$("#hm").value, a=+$("#aw").value; if(h===a) return alert("اختر فريقين مختلفين");
  await sb.from("matches").insert({week:+$("#wk").value||null,home_id:h,away_id:a,match_date:$("#dt").value||null,match_time:$("#tm").value||null});
  await log(`إضافة مباراة ${names[h]} ضد ${names[a]}`); refresh();
};
async function fin(id){
  const h=$("#h"+id).value, a=$("#a"+id).value; if(h===""||a==="") return alert("أدخل النتيجة");
  const x=D.matches.find(m=>m.id===id);
  await sb.from("matches").update({home_goals:+h,away_goals:+a,status:"finished"}).eq("id",id);
  await log(`نتيجة ${names[x.home_id]} ${h}-${a} ${names[x.away_id]}`); refresh();
}
async function post(id){ const x=D.matches.find(m=>m.id===id);
  await sb.from("matches").update({status:"postponed"}).eq("id",id); await log(`تأجيل ${names[x.home_id]} ضد ${names[x.away_id]}`); refresh(); }
async function sch(id){ const d=prompt("التاريخ الجديد (مثال 2026-11-20)"); if(!d) return; const t=prompt("الوقت (مثال 17:00)")||null;
  const x=D.matches.find(m=>m.id===id);
  await sb.from("matches").update({status:"scheduled",match_date:d,match_time:t,home_goals:null,away_goals:null}).eq("id",id);
  await log(`جدولة ${names[x.home_id]} ضد ${names[x.away_id]} إلى ${d}`); refresh(); }
async function delm(id){ if(!confirm("حذف المباراة؟")) return; const x=D.matches.find(m=>m.id===id);
  await sb.from("matches").delete().eq("id",id); await log(`حذف مباراة ${names[x.home_id]} ضد ${names[x.away_id]}`); refresh(); }
$("#adds").onclick = async()=>{
  if(!$("#pn").value.trim()) return;
  await sb.from("scorers").insert({player:$("#pn").value.trim(),team_id:+$("#pt").value,goals:+$("#pg").value||0});
  await log(`إضافة هداف ${$("#pn").value}`); $("#pn").value=""; refresh();
};
async function sg(id){ await sb.from("scorers").update({goals:+$("#g"+id).value}).eq("id",id); await log("تعديل أهداف لاعب"); refresh(); }
async function dels(id){ if(!confirm("حذف اللاعب؟")) return; await sb.from("scorers").delete().eq("id",id); await log("حذف لاعب"); refresh(); }
</script></body></html>
