<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رابطة الشريف والنور الرياضية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script></head><body>
<header><h1>رابطة الشريف والنور الرياضية</h1><p>دوري الموسم الرياضي 2026–2027</p></header>
<nav><button class="on" data-t="t1">الترتيب</button><button data-t="t2">المباريات</button><button data-t="t3">الهدافون</button></nav>
<main>
<section id="t1" class="on"><div class="wrap" id="tbl">جارٍ التحميل...</div><button class="wa" id="w1">مشاركة الترتيب في واتساب</button></section>
<section id="t2"><div id="fx"></div><button class="wa" id="w2">مشاركة المباريات في واتساب</button></section>
<section id="t3"><div class="wrap" id="sc"></div></section>
</main>
<script src="config.js"></script><script src="common.js"></script>
<script>
tabs();
(async()=>{
  const d = await loadAll(); const names = {}; d.teams.forEach(t=>names[t.id]=t.name);
  const st = standings(d.teams, d.matches);
  $("#tbl").innerHTML = tableHTML(st);
  $("#fx").innerHTML = fixturesHTML(d.matches, names);
  $("#sc").innerHTML = d.scorers.length ? `<table><tr><th>م</th><th>اللاعب</th><th>الفريق</th><th>أهداف</th></tr>`+d.scorers.map((s,i)=>`<tr><td>${i+1}</td><td class="n">${esc(s.player)}</td><td>${esc(names[s.team_id])}</td><td class="pts">${s.goals}</td></tr>`).join("")+`</table>` : "<p>لم تُسجَّل أهداف بعد.</p>";
  $("#w1").onclick = ()=> shareWA("🏆 رابطة الشريف والنور - الترتيب\n\n"+st.map((o,i)=>`${i+1}- ${o.name}  لعب ${o.p}  نقاط ${o.pts}`).join("\n"));
  $("#w2").onclick = ()=> shareWA("⚽ مباريات رابطة الشريف والنور\n\n"+d.matches.map(x=>`${names[x.home_id]} ${x.status==="finished"?x.home_goals+"-"+x.away_goals:x.status==="postponed"?"(مؤجلة)":"ضد"} ${names[x.away_id]} ${x.match_date||""} ${x.match_time||""}`).join("\n"));
})();
</script></body></html>
